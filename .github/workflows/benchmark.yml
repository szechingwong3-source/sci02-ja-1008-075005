name: benchmark
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate benchmark.json
        run: |
          echo '{"scores":[2,4,6,8],"mean":5}' > benchmark.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
